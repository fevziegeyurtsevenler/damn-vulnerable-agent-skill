name: lab-integrity
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install git+https://github.com/fevziegeyurtsevenler/uncloak
      - name: The lab must be vulnerable (uncloak should find issues)
        run: |
          if uncloak scan scenarios; then
            echo "::error::scenarios came back CLEAN — the lab is broken"; exit 1
          else
            echo "lab is vulnerable as expected (uncloak flagged issues)"
          fi
